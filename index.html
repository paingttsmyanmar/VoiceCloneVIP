<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceCloneVIP</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">
        VoiceCloneVIP
    </div>

    <button class="login-btn">
        Gmail Login
    </button>
</header>


<section class="hero">

    <h1>
        AI Voice Clone Platform
    </h1>

    <p>
        Create your own AI voice with advanced voice cloning technology.
    </p>


    <div class="card">

        <h2>
            Upload Voice Sample
        </h2>


        <input 
        type="file" 
        id="voiceFile"
        accept="audio/*">


        <h2>
            Enter Text
        </h2>


        <textarea 
        id="textInput"
        placeholder="Type your text here...">
        </textarea>


        <button class="generate-btn">
            Generate Voice
        </button>


        <div class="status">
            Status: Waiting...
        </div>


    </div>


</section>



<section class="vip">

<h2>
VIP Plans
</h2>


<div class="plans">

<div class="plan">
<h3>Free</h3>
<p>Test Voice Clone</p>
</div>


<div class="plan">
<h3>VIP</h3>
<p>Unlimited Voice Access</p>
</div>


<div class="plan">
<h3>Premium</h3>
<p>High Quality AI Voice</p>
</div>


</div>

</section>



<footer>

<p>
© 2026 VoiceCloneVIP
</p>

</footer>



<script src="script.js"></script>

</body>
</html>
